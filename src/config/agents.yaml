# ============================================================
# AGENTS LIBRARY — agents.yaml
#
# A reusable catalogue of agent definitions, decoupled from
# any specific workflow. Reference individual agents from any
# workflow.yaml using:
#
#   agents_ref: ./agents.yaml
#
# and then refer to agents by their key name in nodes:
#
#   nodes:
#     extractor_node:
#       type: agent
#       agent: extractor        ← matches the key below
#
# Agents defined here carry no knowledge of graph topology —
# no edges, no routing, no workflow-specific wiring.
# ============================================================

version: "1.2"


# ──────────────────────────────────────────────────────────────
# DEFAULTS
# Agent-level defaults. Any field here is inherited by all
# agents unless explicitly overridden on the agent itself.
# Workflow-level defaults take lower precedence than these.
# ──────────────────────────────────────────────────────────────
defaults:
  model: openai/gpt-4o-mini
  temperature: 0
  max_tokens: 16384
  retry:
    max_attempts: 4
    backoff: exponential          # linear | exponential | fixed
    delay_seconds: 1


# ──────────────────────────────────────────────────────────────
# AGENTS
#
# Each agent key is the identifier used in workflow nodes.
#
# Fields:
#   role        — professional identity injected into system prompt
#   goal        — primary objective; supports {var} interpolation
#   backstory   — background context that shapes agent behaviour
#   model       — LiteLLM model string: provider/model-name
#   temperature — 0.0–1.0; overrides defaults.temperature
#   max_tokens  — max response tokens; overrides defaults.max_tokens
#   input_keys  — state keys this agent reads as context
#   output_key  — state key this agent writes its result to
#
#   system_prompt — two modes (mutually exclusive):
#     inline: "..."        embed the prompt directly in this file
#     file: ./path/to.md   load from an external file at runtime
#
#   output_schema — two modes (mutually exclusive):
#     ref: my_pkg.ClassName    Pydantic class; strict structured output
#     example: {...}           sample JSON object; loader infers schema
# ──────────────────────────────────────────────────────────────
agents:

  # ── extractor ──────────────────────────────────────────────
  extractor:
    role: "KYC Document Extraction Specialist"
    goal: "Extract all person records from KYC documents with accurate source references"
    backstory: |
      You are an expert in extracting structured person data from legal and compliance
      documents. You handle German documents with umlauts and specialised terminology,
      always capturing job titles in both the original language and English translation.
      You never invent data — if a field is not present, you leave it null.
    input_keys: [documents, extraction_feedback]
    output_key: extracted_persons
    output_schema:
      ref: src.models.person.ExtractedPerson
    system_prompt:
      file: ../prompts/extractor.md

  # ── critic_1 ───────────────────────────────────────────────
  critic_1:
    role: "Extraction Quality Auditor"
    goal: "Validate that every extracted person has mandatory fields and valid source references"
    backstory: |
      You are a meticulous quality assurance specialist with deep experience in KYC
      data standards. You ensure extracted records meet all mandatory field requirements
      before they proceed to deduplication. You are fair but uncompromising on
      data completeness.
    input_keys: [extracted_persons, extraction_retry_count]
    output_key: last_critic_feedback
    output_schema:
      ref: src.models.workflow.CriticFeedback
    system_prompt:
      file: ../prompts/critic_1.md

  # ── reconciler ─────────────────────────────────────────────
  reconciler:
    role: "Person Record Reconciliation Specialist"
    goal: "Identify and merge duplicate person records using fuzzy name matching"
    backstory: |
      You are an expert in entity resolution and record linkage. You identify persons
      appearing multiple times under slightly different names or formats, merge their
      records into a single canonical entry, preserve all source references, and flag
      any conflicting field values for downstream review.
    input_keys: [extracted_persons, reconciliation_feedback]
    output_key: reconciled_persons
    output_schema:
      ref: src.models.person.ReconciledPerson
    system_prompt:
      file: ../prompts/reconciler.md

  # ── critic_2 ───────────────────────────────────────────────
  critic_2:
    role: "Reconciliation Quality Auditor"
    goal: "Validate that deduplication is correct, complete, and preserves all source references"
    backstory: |
      You are a quality assurance specialist focused on entity resolution accuracy.
      You detect missed duplicates, incorrect merges, and lost source references.
      Your approval means the deduplicated record set faithfully represents all
      persons found across the source documents.
    input_keys: [reconciled_persons, duplicate_groups, reconciliation_retry_count]
    output_key: last_critic_feedback
    output_schema:
      ref: src.models.workflow.CriticFeedback
    system_prompt:
      file: ../prompts/critic_2.md

  # ── classifier ─────────────────────────────────────────────
  classifier:
    role: "KYC CSM Classification Specialist"
    goal: "Classify each person as CSM or NON_CSM based on regulatory criteria with explicit reasoning"
    backstory: |
      You are a KYC compliance expert with deep knowledge of Controlling Senior Manager
      (CSM) regulations. You apply the official CSM criteria rigorously, cite the
      specific criterion met or not met for each person, and provide supporting evidence
      from the source documents. You never classify without a clear, criteria-based
      justification.
    input_keys: [reconciled_persons, classification_feedback]
    output_key: classified_persons
    output_schema:
      ref: src.models.person.ClassifiedPerson
    system_prompt:
      file: ../prompts/classifier.md

  # ── critic_3 ───────────────────────────────────────────────
  critic_3:
    role: "Classification Quality Auditor"
    goal: "Validate classification reasoning quality and criteria citation for every person"
    backstory: |
      You are a KYC compliance auditor specialising in CSM determination reviews.
      You verify that every classification cites specific CSM criteria, that the
      reasoning is consistent with the stated evidence, and that no person has been
      classified without substantive justification. Your approval certifies the
      classification is audit-ready.
    input_keys: [classified_persons, classification_retry_count]
    output_key: last_critic_feedback
    output_schema:
      ref: src.models.workflow.CriticFeedback
    system_prompt:
      file: ../prompts/critic_3.md

  # ── formatter ──────────────────────────────────────────────
  formatter:
    role: "KYC Output Formatter"
    goal: "Produce the final structured JSON output with document manifest and separated CSM/NON_CSM person lists"
    backstory: |
      You are a structured data specialist who assembles the final workflow output.
      You organise classified persons into CSM and NON_CSM lists, compile the document
      manifest, and ensure the output conforms exactly to the required JSON schema.
    input_keys: [classified_persons, documents]
    output_key: document_manifest
    output_schema:
      ref: src.models.output.WorkflowOutput
    system_prompt:
      file: ../prompts/formatter.md
