# ============================================================
# AGENTFLOW YAML SPECIFICATION v1.2
#
# Agents are defined in agents.yaml and referenced here by key.
# This file owns: workflow metadata, state schema, nodes,
# edges, observability, runtime, and variables.
# ============================================================

version: "1.2"

workflow:
  id: kyc_document_processing
  name: "KYC Document Processing"
  description: "Multi-agent workflow for extracting, reconciling, and classifying persons from KYC documents with critic validation at each stage."
  entry_point: __start__
  max_steps: 30
  timeout_seconds: 600


# ──────────────────────────────────────────────────────────────
# AGENTS IMPORT
# Points to the shared agent library. All agent keys defined
# in that file are available to nodes in this workflow.
# ──────────────────────────────────────────────────────────────
agents_ref: ./agents.yaml


# ──────────────────────────────────────────────────────────────
# STATE SCHEMA
# ──────────────────────────────────────────────────────────────
state:
  workflow_id:                { type: string }
  documents:                  { type: object,  default: [] }
  extracted_persons:          { type: object,  default: [] }
  extraction_retry_count:     { type: integer, default: 0 }
  extraction_feedback:        { type: string,  default: null }
  reconciled_persons:         { type: object,  default: [] }
  duplicate_groups:           { type: object,  default: [] }
  reconciliation_retry_count: { type: integer, default: 0 }
  reconciliation_feedback:    { type: string,  default: null }
  classified_persons:         { type: object,  default: [] }
  classification_retry_count: { type: integer, default: 0 }
  classification_feedback:    { type: string,  default: null }
  last_critic_feedback:       { type: object,  default: null }
  document_manifest:          { type: object,  default: [] }
  csm_list:                   { type: object,  default: [] }
  non_csm_list:               { type: object,  default: [] }
  current_agent:              { type: string,  default: "extractor" }
  status:                     { type: string,  default: "pending" }
  failure_reason:             { type: string,  default: null }


# ──────────────────────────────────────────────────────────────
# NODES
# Each node declares WHAT it does — nothing about routing.
# Valid types: agent | parallel | merger | human | subgraph | end
#
# __start__ is a built-in sentinel — no node definition needed.
# ──────────────────────────────────────────────────────────────
nodes:

  extractor:
    type: agent
    agent: extractor

  critic_1:
    type: agent
    agent: extractor_critic

  # reconciler:
  #   type: agent
  #   agent: reconciler

  # critic_2:
  #   type: agent
  #   agent: critic_2

  # classifier:
  #   type: agent
  #   agent: classifier

  # critic_3:
  #   type: agent
  #   agent: critic_3

  formatter:
    type: agent
    agent: formatter

  end:
    type: end


# ──────────────────────────────────────────────────────────────
# EDGES
#
# Unconditional edges: just from/to.
#
# Conditional edges: fn: + routes:
#   fn:      fully-qualified Python callable — fn(state: dict) -> str
#   routes:  maps return value strings to destination node names
#   default: reserved key — warn-and-continue fallback
#
# on_traverse: optional side-effects applied when this edge fires
#   when_route:    only apply side-effects when fn returns this value
#   increment_key: bumps an integer state key by 1
# ──────────────────────────────────────────────────────────────
edges:

  # ── Entry ──────────────────────────────────────────────────
  - from: __start__
    to: extractor

  # ── Extraction phase ───────────────────────────────────────
  - from: extractor
    to: extractor_critic

  # fn returns: "pass" | "fail_retry" | "fail_max"
  - from: extractor_critic
    condition:
      fn: src.core.conditions.route_on_extractor_critic_decision
      routes:
        pass:       formatter
        fail_retry: extractor
        fail_max:   end
        default:    end

  # # ── Reconciliation phase ───────────────────────────────────
  # - from: reconciler
  #   to: critic_2

  # # fn returns: "pass" | "fail_retry" | "fail_max"
  # - from: critic_2
  #   condition:
  #     fn: src.core.conditions.route_on_critic_decision
  #     routes:
  #       pass:       classifier
  #       fail_retry: reconciler
  #       fail_max:   end
  #       default:    end

  # # ── Classification phase ───────────────────────────────────
  # - from: classifier
  #   to: critic_3

  # # fn returns: "pass" | "fail_retry" | "fail_max"
  # - from: critic_3
  #   condition:
  #     fn: src.core.conditions.route_on_critic_decision
  #     routes:
  #       pass:       formatter
  #       fail_retry: classifier
  #       fail_max:   end
  #       default:    end

  # ── Output ─────────────────────────────────────────────────
  - from: formatter
    to: end


# ──────────────────────────────────────────────────────────────
# OBSERVABILITY
# ──────────────────────────────────────────────────────────────
observability:
  provider: langsmith               # langsmith | langfuse | none
  project: kyc_document_processing
  tags: [production, kyc]
  trace_state: true
  trace_inputs: true
  trace_outputs: true


# ──────────────────────────────────────────────────────────────
# RUNTIME
# ──────────────────────────────────────────────────────────────
runtime:
  framework: langgraph
  checkpointer: sqlite              # sqlite | postgres | memory | redis
  checkpointer_uri: "sqlite:///./kyc_workflows.db"
  interrupt_before: []
  interrupt_after: []


# ──────────────────────────────────────────────────────────────
# VARIABLES
# ──────────────────────────────────────────────────────────────
vars:
  upload_dir: "${UPLOAD_DIR}"
  max_file_size_mb: "${MAX_FILE_SIZE_MB}"
