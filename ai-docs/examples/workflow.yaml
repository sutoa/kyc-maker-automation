# ============================================================
# AGENTFLOW YAML SPECIFICATION v1.2
#
# Agents are defined in agents.yaml and referenced here by key.
# This file owns: workflow metadata, tools, state schema,
# nodes, edges, observability, runtime, and variables.
# ============================================================

version: "1.2"

workflow:
  id: research_and_report
  name: "Research & Report Pipeline"
  description: "Multi-agent workflow that researches a topic, critiques the output, and produces a polished report."
  entry_point: __start__            # built-in sentinel — no node definition needed
  max_steps: 50
  timeout_seconds: 300


# ──────────────────────────────────────────────────────────────
# AGENTS IMPORT
# Points to the shared agent library. All agent keys defined
# in that file are available to nodes in this workflow.
# An inline agents: block here would override this import
# for any keys that collide — useful for workflow-specific
# overrides without editing the shared library.
# ──────────────────────────────────────────────────────────────
agents_ref: ./agents.yaml


# ──────────────────────────────────────────────────────────────
# GLOBAL DEFAULTS
# These apply to this workflow only and are lower precedence
# than defaults defined inside agents.yaml.
# ──────────────────────────────────────────────────────────────
defaults:
  model: openai/gpt-4o
  temperature: 0.3
  max_tokens: 2048
  retry:
    max_attempts: 3
    backoff: exponential          # linear | exponential | fixed
    delay_seconds: 2


# ──────────────────────────────────────────────────────────────
# TOOLS REGISTRY
# ──────────────────────────────────────────────────────────────
tools:
  web_search:
    type: builtin                 # builtin | mcp | function | langchain
    name: web_search

  sql_query:
    type: function
    ref: my_package.tools.run_sql

  github_tool:
    type: mcp
    server_url: https://mcp.github.com/sse
    name: github

  summarizer:
    type: langchain
    class: langchain_community.tools.WikipediaQueryRun
    args:
      top_k_results: 3


# ──────────────────────────────────────────────────────────────
# STATE SCHEMA
# ──────────────────────────────────────────────────────────────
state:
  topic:              { type: string }
  research:           { type: string,  default: "" }
  critique:           { type: string,  default: "" }
  report:             { type: string,  default: "" }
  approved:           { type: boolean, default: false }
  loop_count:         { type: integer, default: 0 }
  fact_check_result:  { type: object,  default: {} }
  sentiment_result:   { type: object,  default: {} }
  human_feedback:     { type: string,  default: "" }


# ──────────────────────────────────────────────────────────────
# NODES
# Each node declares WHAT it does — nothing about routing.
# Valid types: agent | parallel | merger | human | subgraph | end
#
# __start__ is a built-in sentinel — no node definition needed.
# agent: references a key from agents.yaml (via agents_ref)
#        or from an inline agents: block in this file.
# ──────────────────────────────────────────────────────────────
nodes:

  researcher:
    type: agent
    agent: researcher

  parallel_checks:
    type: parallel
    branches:
      - fact_checker_node
      - sentiment_node
    merge_strategy: merge_all         # merge_all | first | reduce

  fact_checker_node:
    type: agent
    agent: fact_checker

  sentiment_node:
    type: agent
    agent: sentiment_analyzer

  merge_checks:
    type: merger
    inputs: [fact_checker_node, sentiment_node]
    merge_fn: my_package.mergers.combine_checks

  critic:
    type: agent
    agent: critic

  writer:
    type: agent
    agent: writer

  human_review:
    type: human
    prompt: "Please review the report and approve or request changes."
    timeout_seconds: 3600
    on_timeout: end
    input_keys: [report]
    output_key: human_feedback

  deep_research_branch:
    type: subgraph
    workflow_ref: ./deep_research_workflow.yaml
    input_mapping:
      topic: topic
    output_mapping:
      deep_result: research

  end:
    type: end


# ──────────────────────────────────────────────────────────────
# EDGES
#
# Unconditional edges: just from/to.
#
# Conditional edges: fn: + routes:
#   fn:      fully-qualified Python callable — fn(state: dict) -> str
#   routes:  maps return value strings to destination node names
#   default: reserved key — warn-and-continue fallback for any
#            return value not present in routes
#
# on_traverse: optional side-effects applied when this edge fires
#   when_route:    only apply side-effects when fn returns this value
#   increment_key: bumps an integer state key by 1
# ──────────────────────────────────────────────────────────────
edges:

  # ── Entry: route by topic complexity ───────────────────────
  # __start__ fires immediately when the workflow is invoked.
  # fn returns: "deep" | "simple"
  - from: __start__
    condition:
      fn: my_package.conditions.route_by_complexity
      routes:
        deep:    deep_research_branch
        simple:  researcher
        default: researcher            # warn + fallback if unexpected value

  # ── Deep research rejoins main flow ────────────────────────
  - from: deep_research_branch
    to: researcher

  # ── Linear flow through parallel quality checks ────────────
  - from: researcher
    to: parallel_checks

  - from: parallel_checks
    to: merge_checks

  - from: merge_checks
    to: critic

  # ── Feedback loop: exit or loop back ───────────────────────
  # fn returns: "true" (quality met) | "false" (loop back)
  - from: critic
    condition:
      fn: my_package.conditions.should_exit
      routes:
        "true":  writer
        "false": researcher
        default: researcher            # warn + fallback
    on_traverse:
      when_route: "false"             # only increment when looping back
      increment_key: loop_count

  # ── Final review and completion ────────────────────────────
  - from: writer
    to: human_review

  - from: human_review
    to: end


# ──────────────────────────────────────────────────────────────
# OBSERVABILITY
# ──────────────────────────────────────────────────────────────
observability:
  provider: langsmith               # langsmith | langfuse | none
  project: my_research_project
  tags: [production, research]
  trace_state: true
  trace_inputs: true
  trace_outputs: true


# ──────────────────────────────────────────────────────────────
# RUNTIME
# ──────────────────────────────────────────────────────────────
runtime:
  framework: langgraph
  checkpointer: sqlite              # sqlite | postgres | memory | redis
  checkpointer_uri: "sqlite:///./checkpoints.db"
  interrupt_before: [human_review]
  interrupt_after: []


# ──────────────────────────────────────────────────────────────
# VARIABLES
# ──────────────────────────────────────────────────────────────
vars:
  topic: "${INPUT_TOPIC}"
  current_year: "${CURRENT_YEAR}"
